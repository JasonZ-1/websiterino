<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SummaWeb</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="card">
      <div class="header">
        <img class="logo" src="images/icon-512.png"></img>
        <div style="flex:1">
          <h1>SummaWeb</h1>  
          <p class="desc">Quickly get text summaries in fonts designed for dyslexia</p>
        </div>
      </div>

      <div class="row" style="align-items:center">
        <div>
          <div class="small">Summarizer</div>
          <div class="statusText" id="stateText">Enabled</div>
        </div>
        <label class="switch" id="switchLabel" aria-label="Toggle feature">
          <input type="checkbox" id="toggle" />
          <div class="knob" aria-hidden="true"></div>
        </label>
      </div>

      <div class="footer">When enabled, a button will appear above any highlighted text.</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
